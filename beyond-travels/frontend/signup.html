<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup - Beyond Travels</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-left">
      <h1>Join <span style="color:#111">Beyond</span> 🌍</h1>
      <p>Free account banao aur best travel deals pao.</p>
    </div>

    <div class="auth-right">
      <div class="card">
        <h2>Signup</h2>

        <div class="form-group">
          <label>Name</label>
          <input type="text" id="name" placeholder="Ankit Kumar" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Phone No</label>
          <input type="text" id="phone" maxlength="10" placeholder="9876543210" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="min 6 characters" />
        </div>

        <button class="btn" id="signupBtn">Create Account</button>
        <div class="msg" id="msg"></div>

        <p class="switch">Pehle se account hai? <a href="index.html">Login karo</a></p>
      </div>
    </div>
  </div>

  <script src="js/signup.js"></script>
</body>
</html>
