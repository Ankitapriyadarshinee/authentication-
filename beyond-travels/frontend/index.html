<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Beyond Travels</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-left">
      <h1>Beyond <span style="color:#111">Travels</span> ✈️</h1>
      <p>Apni agli yatra book karo – hotel, flight aur tour packages ek jagah.</p>
    </div>

    <div class="auth-right">
      <div class="card">
        <h2>Login</h2>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••" />
        </div>

        <button class="btn" id="loginBtn">Login</button>
        <div class="msg" id="msg"></div>

        <p class="switch">Account nahi hai? <a href="signup.html">Signup karo</a></p>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
